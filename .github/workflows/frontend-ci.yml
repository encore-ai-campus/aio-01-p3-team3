name: Frontend CI CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy frontend to frontend_server"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/requirements/*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/runtime.txt
      - name: Validate Python source
        run: python -m compileall -q src
      - name: Prepare CI environment file
        run: cp config/.env.docker.example .env.docker
      - name: Validate Compose
        run: docker compose -f deploy/compose.yml config --quiet
      - name: Build frontend image
        run: docker compose -f deploy/compose.yml build

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment: frontend_server
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy frontend source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          echo "Checking SSH connection"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 "$AWS_USER@$AWS_HOST" 'mkdir -p ~/frontend'
          echo "Copying frontend source"
          scp -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -r frontend/. "$AWS_USER@$AWS_HOST:~/frontend/"
      - name: Deploy frontend
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 "$AWS_USER@$AWS_HOST" 'bash -se' <<'REMOTE'
          cd ~/frontend

          if [ ! -f .env.docker ]; then
            echo "ERROR: ~/frontend/.env.docker is missing"
            echo "Remote user: $(whoami)"
            echo "Remote home: $HOME"
            echo "Current directory: $(pwd)"
            echo "Contents of ~/frontend:"
            ls -la 2>&1 || true
            echo "Detected .env.docker paths under ~/frontend:"
            find "$HOME/frontend" -maxdepth 3 -type f -name '.env.docker' -print 2>/dev/null || true
            exit 1
          fi

          docker compose -f deploy/compose.yml config --quiet
          echo "Docker disk usage before cleanup"
          docker system df
          docker system prune --all --force
          echo "Docker disk usage after cleanup"
          docker system df
          docker compose -f deploy/compose.yml up -d --build --remove-orphans
          REMOTE
