name: weather-backend

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env.docker
    environment:
      DB_PATH: /app/data/app.db
    volumes:
      - backend-data:/app/data   # SQLite(캐시·로그·프로필). 재배포해도 유지됩니다.
    ports:
      - "8000:8000"

volumes:
  backend-data:
